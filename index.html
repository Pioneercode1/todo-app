<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Todo app</title>

  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>

</head>

<body>
  <main class="app-container">
    <div class="hero-container">
      <h1 class="h-hero">Todo</h1>
      <button class="btn-theme">
        <img class="img-theme" src="./images/icon-moon.svg" alt="logo theme" width="20" height="20">
      </button>
    </div>

    <picture class="picture">
      <source media="(min-width: 1024px)" srcset="./images/bg-desktop-light.jpg">
      <img src="./images/bg-mobile-light.jpg" width="375" height="auto" alt="background mobile light">
    </picture>

    <div class="div-todo-text">
        <svg xmlns="http://www.w3.org/2000/svg" class="btn-add-todo" role="button" height="24" viewBox="0 -960 960 960" width="24" fill="#48752C">
          <path
            d="M440-280h80v-160h160v-80H520v-160h-80v160H280v80h160v160zm40 200q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93zm0-320z" />
        </svg>
      <input type="text" name="todo-text" id="todo-text" placeholder="Create a new todo">
    </div>

    <ul class="todo-list" id="todo-list"></ul>

    <!-- Add dynamic number -->
    <div class="list-footer-wrapper">
      <div class="items-left">
        <div class="items-left-number">
          <span id="dynamic-number">0</span>
          <span>items left</span>
        </div>
        <button class="btns" id="btn-clear-completed">Clear Completed</button>
      </div>

      <div class="btn-container">
        <button class="btns" id="btn-all">All</button>
        <button class="btns" id="btn-active">Active</button>
        <button class="btns" id="btn-completed">Completed</button>
      </div>
    </div>

    <p class="p-drag">Drag and drop to reorder list</p>

  </main>

</body>

</html>
